name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Test
        run: |
          cd backend
          go test ./... -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API service
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile.api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-service:latest
          platforms: linux/amd64,linux/arm64

      - name: Build and push Ingestor service
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile.ingestor
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ingestor-service:latest
          platforms: linux/amd64,linux/arm64

      - name: Build and push Processor service
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile.processor
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/processor-service:latest
          platforms: linux/amd64,linux/arm64
