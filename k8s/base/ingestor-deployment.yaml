apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor-service
  labels:
    app: ingestor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestor-service
  template:
    metadata:
      labels:
        app: ingestor-service
    spec:
      containers:
        - name: ingestor-service
          image: ${DOCKER_REGISTRY}/ingestor-service:latest
          ports:
            - containerPort: 8081
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            limits:
              cpu: "0.5"
              memory: "256Mi"
            requests:
              cpu: "0.2"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ingestor-service
spec:
  selector:
    app: ingestor-service
  ports:
    - port: 80
      targetPort: 8081
  type: ClusterIP
